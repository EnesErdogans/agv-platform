gateway_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 8765
    token: ""                 # boş = şifresiz. Doluysa istemci önce {"type":"auth","token":..} göndermeli
    teleop_timeout: 0.5
    max_lin_vel: 0.8
    max_ang_vel: 1.0
    telemetry_hz: 10.0
    scan_hz: 5.0
    map_period: 2.0           # harita en fazla 0.5 Hz (sadece değişince)
    stations_file: "~/.agv/stations.yaml"
    map_dir: "~/.agv/maps"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
    nav_action: "navigate_to_pose"
    allow_takeover: true      # request_control mevcut controller'dan kontrolü devralabilir
    estop_cancels_goal: true
    status_timeout: 2.0
